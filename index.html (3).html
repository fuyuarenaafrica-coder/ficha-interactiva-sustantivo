<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>El sustantivo · Ficha interactiva</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5fa;color:#17233c;font:17px system-ui}main{max-width:1000px;margin:auto;padding:24px}header,section{background:white;border:1px solid #d5dce8;border-radius:12px;padding:22px;margin-bottom:18px}h1{margin:0}h2{font-size:21px;color:#43328a;margin:0 0 8px}p{margin:8px 0 16px}.item{padding:12px 0;border-top:1px solid #e3e7ef;display:flex;flex-wrap:wrap;gap:10px;align-items:center}.prompt{min-width:220px;flex:1}button,select,input{font:inherit;padding:9px 12px;border:1px solid #a8b4ca;border-radius:7px;background:white;color:inherit}button{cursor:pointer}button[aria-pressed=true]{background:#e1dcff;border:2px solid #5841b0}button.primary{background:#43328a;color:white;border:0} .choices{display:flex;flex-wrap:wrap;gap:6px;flex:2;min-width:240px}.feedback{width:100%;font-size:15px}.ok{color:#17643a}.bad{color:#a12626}.bar{position:sticky;bottom:0;background:white;padding:14px;border:1px solid #d5dce8;border-radius:10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}input{max-width:100%}small{color:#53627b}</style><main><header><small>LENGUA CASTELLANA Y LITERATURA · 1.º ESO</small><h1>El sustantivo</h1><p>Completa las actividades y comprueba tus respuestas. Puedes corregirlas tantas veces como necesites.</p><label>Nombre (opcional) <input placeholder="Tu nombre"></label></header><div id="sheet"></div><div class="bar"><button class="primary" onclick="check()">Comprobar respuestas</button><button onclick="resetSheet()">Reiniciar</button><strong id="score" aria-live="polite"></strong></div></main><script>const data=[["Identifica los sustantivos", "Selecciona todos los sustantivos de cada oración.", [["La tormenta provocó miedo entre los vecinos.", ["tormenta", "miedo", "vecinos"], ["La", "tormenta", "provocó", "miedo", "entre", "los", "vecinos"]], ["El equipo celebró su victoria en el pabellón.", ["equipo", "victoria", "pabellón"], ["El", "equipo", "celebró", "su", "victoria", "en", "el", "pabellón"]], ["La paciencia requiere esfuerzo.", ["paciencia", "esfuerzo"], ["La", "paciencia", "requiere", "esfuerzo"]]]], ["La palabra intrusa", "Selecciona la palabra que no es un sustantivo.", [["alegría · tristeza · amable · ilusión", ["amable"], ["alegría", "tristeza", "amable", "ilusión"]], ["carrera · correr · recorrido · corredor", ["correr"], ["carrera", "correr", "recorrido", "corredor"]], ["altura · anchura · estrecho · longitud", ["estrecho"], ["altura", "anchura", "estrecho", "longitud"]], ["ruido · silencio · sonar · sonido", ["sonar"], ["ruido", "silencio", "sonar", "sonido"]]]], ["Género y número", "Clasifica cada sustantivo.", [["las crisis", "Femenino plural", ["Masculino singular", "Masculino plural", "Femenino singular", "Femenino plural"]], ["el análisis", "Masculino singular", ["Masculino singular", "Masculino plural", "Femenino singular", "Femenino plural"]], ["las raíces", "Femenino plural", ["Masculino singular", "Masculino plural", "Femenino singular", "Femenino plural"]], ["los paraguas", "Masculino plural", ["Masculino singular", "Masculino plural", "Femenino singular", "Femenino plural"]], ["la actriz", "Femenino singular", ["Masculino singular", "Masculino plural", "Femenino singular", "Femenino plural"]]]], ["Forma el femenino", "Escribe el femenino.", [["duque", "duquesa", null], ["poeta", "poetisa|poeta", null], ["príncipe", "princesa", null], ["tigre", "tigresa", null], ["héroe", "heroína", null]]], ["Forma el plural", "Escribe el plural.", [["reloj", "relojes", null], ["luz", "luces", null], ["régimen", "regímenes", null], ["jabalí", "jabalíes|jabalís", null], ["crisis", "crisis", null], ["compás", "compases", null]]], ["Comunes y propios", "Clasifica cada palabra.", [["Lanzarote", "Propio: topónimo", ["Común", "Propio: antropónimo", "Propio: topónimo"]], ["arquitecta", "Común", ["Común", "Propio: antropónimo", "Propio: topónimo"]], ["Lucía", "Propio: antropónimo", ["Común", "Propio: antropónimo", "Propio: topónimo"]], ["archipiélago", "Común", ["Común", "Propio: antropónimo", "Propio: topónimo"]], ["Agüimes", "Propio: topónimo", ["Común", "Propio: antropónimo", "Propio: topónimo"]]]], ["Concretos y abstractos", "Clasifica los sustantivos.", [["nostalgia", "Abstracto", ["Concreto", "Abstracto"]], ["brújula", "Concreto", ["Concreto", "Abstracto"]], ["justicia", "Abstracto", ["Concreto", "Abstracto"]], ["oxígeno", "Concreto", ["Concreto", "Abstracto"]], ["generosidad", "Abstracto", ["Concreto", "Abstracto"]]]], ["Contables e incontables", "Clasifica según el sentido de la expresión.", [["tres maletas", "Contable", ["Contable", "Incontable"]], ["un poco de harina", "Incontable", ["Contable", "Incontable"]], ["varios satélites", "Contable", ["Contable", "Incontable"]], ["mucha arena", "Incontable", ["Contable", "Incontable"]], ["dos herramientas", "Contable", ["Contable", "Incontable"]]]], ["Individuales y colectivos", "Clasifica cada sustantivo.", [["orquesta", "Colectivo", ["Individual", "Colectivo"]], ["músicos", "Individual", ["Individual", "Colectivo"]], ["cordillera", "Colectivo", ["Individual", "Colectivo"]], ["montañas", "Individual", ["Individual", "Colectivo"]], ["rebaño", "Colectivo", ["Individual", "Colectivo"]], ["soldado", "Individual", ["Individual", "Colectivo"]]]], ["Clasificación completa", "Selecciona todas las características pertinentes de cada sustantivo.", [["los archipiélagos", ["Común", "Concreto", "Contable", "Colectivo", "Masculino plural"], ["Común", "Propio", "Concreto", "Abstracto", "Contable", "Incontable", "Individual", "Colectivo", "Masculino singular", "Masculino plural", "Femenino singular", "Femenino plural"]], ["la arboleda", ["Común", "Concreto", "Contable", "Colectivo", "Femenino singular"], ["Común", "Propio", "Concreto", "Abstracto", "Contable", "Incontable", "Individual", "Colectivo", "Masculino singular", "Masculino plural", "Femenino singular", "Femenino plural"]], ["las brújulas", ["Común", "Concreto", "Contable", "Individual", "Femenino plural"], ["Común", "Propio", "Concreto", "Abstracto", "Contable", "Incontable", "Individual", "Colectivo", "Masculino singular", "Masculino plural", "Femenino singular", "Femenino plural"]], ["el cobre (material)", ["Común", "Concreto", "Incontable", "Masculino singular"], ["Común", "Propio", "Concreto", "Abstracto", "Contable", "Incontable", "Individual", "Colectivo", "Masculino singular", "Masculino plural", "Femenino singular", "Femenino plural"]], ["la paciencia (cualidad)", ["Común", "Abstracto", "Incontable", "Femenino singular"], ["Común", "Propio", "Concreto", "Abstracto", "Contable", "Incontable", "Individual", "Colectivo", "Masculino singular", "Masculino plural", "Femenino singular", "Femenino plural"]]]]];const records=[];const norm=s=>s.trim().toLocaleLowerCase('es').normalize('NFC');const sheet=document.getElementById('sheet');data.forEach(([title,desc,items],si)=>{const sec=document.createElement('section');sec.innerHTML=`<h2>${si+1}. ${title}</h2><p>${desc}</p>`;items.forEach(([q,a,opts],i)=>{const row=document.createElement('div');row.className='item';const label=document.createElement('div');label.className='prompt';label.textContent=`${String.fromCharCode(97+i)}) ${q}`;row.append(label);let get,clear; if(Array.isArray(a)){const choices=document.createElement('div');choices.className='choices';const selected=new Set();opts.forEach(o=>{const b=document.createElement('button');b.textContent=o;b.setAttribute('aria-pressed','false');b.onclick=()=>{selected.has(o)?selected.delete(o):selected.add(o);b.setAttribute('aria-pressed',String(selected.has(o)))};choices.append(b)});row.append(choices);get=()=>[...selected];clear=()=>{selected.clear();choices.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed','false'))}}else{const el=document.createElement(opts?'select':'input');el.setAttribute('aria-label',q);if(opts){el.add(new Option('Selecciona…',''));opts.forEach(o=>el.add(new Option(o,o)))}else{el.placeholder='Escribe aquí';el.autocomplete='off'}row.append(el);get=()=>el.value;clear=()=>el.value=''}const fb=document.createElement('div');fb.className='feedback';fb.setAttribute('aria-live','polite');row.append(fb);records.push({a,get,clear,fb});sec.append(row)});sheet.append(sec)});function check(){let n=0;records.forEach(({a,get,fb})=>{const v=get();const empty=Array.isArray(v)?!v.length:!v.trim();const ok=Array.isArray(a)?v.length===a.length&&a.every(x=>v.includes(x)):a.split('|').some(x=>norm(x)===norm(v));n+=Number(ok);fb.className='feedback '+(ok?'ok':'bad');fb.textContent=ok?'✓ Correcto':empty?'Pendiente de responder':Array.isArray(a)?`Revisa la selección: ${v.filter(x=>a.includes(x)).length} características o palabras correctas de ${a.length}.`:'Revisa tu respuesta.'});document.getElementById('score').textContent=`${n} de ${records.length} apartados correctos · ${Math.round(n/records.length*100)} %`};function resetSheet(){if(confirm('¿Borrar todas las respuestas?')){records.forEach(r=>{r.clear();r.fb.textContent='' });document.getElementById('score').textContent=''}} </script></html>
